name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test:run
      - run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Mirrors dist/ over encrypted FTP (FTPS) to lifts.markcossey.co.uk.
      # The FTP account's home folder is the subdomain's document root.
      # --delete removes old build files, but api/ (the future data-sync
      # API) and .well-known/ (SSL certificate renewal) are left alone.
      - name: Upload to hosting
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp --env-password -u "$FTP_USER" plesk101.hostinguk.net -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 3;
            mirror --reverse --delete --verbose --parallel=4 \
              --exclude-glob api/ --exclude-glob .well-known/ \
              --exclude-glob .ftp-deploy-sync-state.json \
              dist/ ./;
            quit"
