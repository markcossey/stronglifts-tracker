name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test:run
      - run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Mirrors over encrypted FTP (FTPS) to lifts.markcossey.co.uk; the FTP
      # account's home folder is the subdomain's document root.
      # 1. dist/ -> site root. --delete removes old build files but leaves
      #    api/ and .well-known/ (SSL certificate renewal) alone.
      # 2. server/api/ -> api/. config.php (DB details + passcode hash, written
      #    by setup.php on the server) is never uploaded or deleted.
      - name: Upload to hosting
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp --env-password -u "$FTP_USER" plesk101.hostinguk.net -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 3;
            mirror --reverse --delete --verbose --parallel=4 \
              --exclude-glob api/ --exclude-glob .well-known/ \
              --exclude-glob .ftp-deploy-sync-state.json \
              dist/ ./;
            mirror --reverse --delete --verbose \
              --exclude-glob config.php \
              server/api/ ./api/;
            quit"
