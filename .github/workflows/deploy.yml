name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test:run
      - run: npm run build

      # Uploads dist/ over encrypted FTP (FTPS) to lifts.markcossey.co.uk.
      # The FTP account's home folder is the subdomain's document root.
      # Only files this action uploaded before are ever deleted, so the
      # future api/ folder and Let's Encrypt's .well-known/ are left alone.
      - name: Upload to hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: plesk101.hostinguk.net
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
